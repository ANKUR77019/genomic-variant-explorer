services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - genomics-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: genomics-web
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      FLASK_HOST: 0.0.0.0
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - genomics-net
    restart: unless-stopped

networks:
  genomics-net:
    external: true

volumes:
  mongodb_data:
    external: true
    name: mongodb_data
